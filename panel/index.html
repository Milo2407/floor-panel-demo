<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,"><title>Floor Panel</title><style>
  html { font-size: 3.1vmin; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: Roboto, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body.ready { transition: background 1.5s, color 1.5s; }
  svg.i { width: 1em; height: 1em; fill: currentColor; vertical-align: middle; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* Two palettes, switched by sun.sun. Day is architect's paper, night is ink. */
  body { --bg: #f2eee6; --ink: #25303a; --soft: #6b747c; --card: #e7e1d6; --card2: #ddd6c9; --wall: #2f3a42; --glass: #9cc7da; --floor: #f7f4ee; --accent: #d9622b; --ok: #3f8f5b; --warn: #c7771b; --cool: #2f7fb8; --glow: 255, 196, 92; }
  body.night { --bg: #0c1320; --ink: #dde6ee; --soft: #7f8c99; --card: #152033; --card2: #1c2a40; --wall: #8ea3b8; --glass: #3d6f8f; --floor: #111b2c; --accent: #ff8a50; --ok: #6cc38a; --warn: #ffb74d; --cool: #6fb6ff; --glow: 255, 186, 92; }
  body { background: var(--bg); color: var(--ink); }

  #app { height: 100vh; padding: 0.9rem 1rem 0.8rem; display: flex; flex-direction: column; }

  /* header */
  header { display: flex; align-items: flex-end; position: relative; }
  /* kiosk toggle sits in the empty middle of the header so it never moves the layout */
  #kiosk { position: absolute; left: 50%; top: 1rem; width: 2.6rem; height: 2.6rem; margin-left: -1.3rem; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; }
  #kiosk svg { font-size: 1.4rem; color: var(--soft); }
  #kiosk.on svg { color: var(--cool); }
  .time { font-size: 3.8rem; font-weight: 300; line-height: 0.95; letter-spacing: -0.03em; }
  .date { font-size: 1.05rem; color: var(--soft); margin-top: 0.2rem; }
  .wx { margin-left: auto; text-align: right; }
  .wx .now { font-size: 1.7rem; display: flex; align-items: center; justify-content: flex-end; }
  .wx .now svg { font-size: 2.2rem; margin-right: 0.35rem; color: var(--accent); }
  .wx .sub { font-size: 0.95rem; color: var(--soft); margin-top: 0.15rem; }

  #plan * { pointer-events: none; }
  #plan .room.tap { cursor: pointer; pointer-events: all; }
  #plan .room.pressed { stroke: var(--accent); }
  #plan .wet { fill: var(--card); }
  #plan .store { fill: url(#hatch); }
  #plan .door { stroke: var(--floor); stroke-width: var(--door-w); }

  #plan .win { fill: var(--glass); }
  #plan .win.open { fill: #26c6da; }
  #plan .winopen { stroke: #26c6da; stroke-width: calc(var(--wall-w) * .9); stroke-linecap: round; }
  #plan .rad { fill: var(--soft); opacity: 0.55; }
  #plan .rad.on { fill: #ff7043; opacity: 1; }
  #plan .glow { transition: opacity 0.8s; }
  #plan text { fill: var(--ink); font-family: inherit; paint-order: stroke; stroke: var(--floor); stroke-width: 3px; stroke-opacity: 0.35; stroke-linejoin: round; }
  #plan .rn { font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--soft); }
  #plan .rt { font-size: 46px; font-weight: 300; }
  #plan .rh { font-size: 17px; fill: var(--soft); }
  #plan .small { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--soft); }
  #plan .flag { font-size: 15px; font-weight: 600; }
  #plan .f-win { fill: #1ba7b8; } #plan .f-heat { fill: #ff7043; } #plan .f-who { fill: var(--ok); } #plan .f-media { fill: #9575cd; } #plan .f-motion { fill: #26a6b8; }
  #plan .motion { fill: #26c6da; opacity: 0; transition: opacity 0.6s; }
  #plan .motion.on { opacity: 0.18; }

  /* status chips */
  .chips { display: flex; flex-wrap: wrap; margin-top: 0.7rem; height: 4.9rem; overflow: hidden; align-content: flex-start; }
  .chip { display: flex; align-items: center; height: 2.2rem; padding: 0 0.8rem; border-radius: 1.1rem; background: var(--card); font-size: 0.95rem; margin: 0 0.45rem 0.45rem 0; white-space: nowrap; }
  .chip svg { font-size: 1.25rem; margin-right: 0.35rem; }
  .chip.ok svg { color: var(--ok); } .chip.warn { background: rgba(255, 152, 0, 0.18); } .chip.warn svg { color: var(--warn); }
  .chip.cool svg { color: var(--cool); } .chip.hot svg { color: var(--accent); }
  .chip.warn.tap { background: rgba(255, 152, 0, 0.28); font-weight: 500; }

  /* actions */
  .actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; grid-column-gap: 0.6rem; }
  .act { position: relative; display: flex; align-items: center; justify-content: center; height: 3.3rem; background: var(--card); border-radius: 1.1rem; font-size: 0.98rem; transition: background 0.3s; white-space: nowrap; }
  .act svg { font-size: 1.5rem; margin-right: 0.35rem; }
  .act.on { background: rgba(var(--glow), 0.3); }
  .act.arm { background: var(--accent); color: #fff; }
  .act .badge { position: absolute; top: -0.45rem; right: -0.2rem; min-width: 1.3rem; height: 1.3rem; border-radius: 0.65rem; background: var(--accent); color: #fff; font-size: 0.8rem; line-height: 1.3rem; padding: 0 0.3rem; }
  #conn { position: fixed; top: 0.25rem; left: 50%; width: 0.5rem; height: 0.5rem; margin-left: -0.25rem; border-radius: 50%; background: transparent; }
  #conn.offline { background: #ef5350; } #conn.connecting { background: #ffb300; }

  /* sheets */
  .scrim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; z-index: 5; }
  .sheet { width: 100%; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 1.5rem 1.5rem 0 0; padding: 1.1rem 1.2rem 1.4rem; }

  .sheet h2 .x { margin-left: auto; font-size: 1.9rem; color: var(--soft); }

  .rows > * + * { margin-top: 0.5rem; }

  .row > svg { font-size: 1.5rem; margin-right: 0.7rem; color: var(--soft); flex: none; }
  .row.on > svg { color: rgb(var(--glow)); } .row.open > svg { color: #26c6da; } .row.bad > svg { color: var(--warn); } .row.good > svg { color: var(--ok); }
  .row .st { margin-left: auto; color: var(--soft); font-size: 1rem; padding-left: 0.6rem; white-space: nowrap; }
  .row .go { margin-left: auto; background: var(--accent); color: #fff; border-radius: 0.7rem; padding: 0.4rem 0.8rem; font-size: 0.98rem; flex: none; }
  .row .go.sec { background: var(--card2); color: var(--ink); margin-left: 0.4rem; }
  .row .go.confirm { background: #c62828; }
  .row input[type=range] { flex: 1; margin: 0 0.4rem 0 0.8rem; height: 2rem; accent-color: var(--accent); }
  .sw { width: 3.2rem; height: 1.8rem; border-radius: 0.9rem; background: var(--card2); position: relative; margin-left: auto; flex: none; }
  .sw:after { content: ''; position: absolute; left: 0.2rem; top: 0.2rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--soft); transition: left 0.2s; }
  .on .sw { background: rgba(var(--glow), 0.55); } .on .sw:after { left: 1.6rem; background: rgb(var(--glow)); }
  .trv { display: flex; align-items: center; background: var(--card); border-radius: 1rem; padding: 0.7rem; }
  .trv .pm { width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--card2); font-size: 1.9rem; display: flex; align-items: center; justify-content: center; }
  .trv .tgt { flex: 1; text-align: center; }
  .trv .tgt .v { font-size: 2.5rem; font-weight: 300; }
  .trv .tgt .a { color: var(--soft); font-size: 0.95rem; }
  .trv.heating .tgt .a { color: var(--accent); }
  .trv .nm { width: 8.5rem; font-size: 1.05rem; }

  .trv.compact .tgt .v { font-size: 1.8rem; }
  .trv.compact .pm { width: 2.8rem; height: 2.8rem; font-size: 1.5rem; }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-column-gap: 0.5rem; margin: 0.55rem 0 0.8rem; }
  .modes button { background: var(--card); border-radius: 0.8rem; padding: 0.55rem 0; color: var(--soft); }
  .modes button.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .allclear { text-align: center; padding: 1.4rem 0 0.6rem; color: var(--ok); font-size: 1.3rem; }
  .allclear svg { font-size: 3rem; display: block; margin: 0 auto 0.4rem; }

  #visitor .sheet { padding: 0.8rem; border-radius: 1.4rem; margin: 0 3% 4vh; }
  #visitor img { width: 100%; border-radius: 1rem; display: block; background: #000; min-height: 20rem; object-fit: cover; }

  #app { gap: .45rem; }
  header, .actions { flex-shrink: 0; }
  #planwrap { flex: 1; min-height: 0; margin: 0; }
  #plan { width: 100%; height: 100%; overflow: hidden; }
  .actions { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
  .chips { height: auto; min-height: 2.2rem; flex-wrap: nowrap; flex-shrink: 0; margin-top: 0; overflow: hidden; }
  .chips .chip { margin-bottom: 0; flex-shrink: 0; }
  /* landscape tablets: the plan takes the left side at full height */
  @media (min-aspect-ratio: 4/3) {
    #app { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto auto 1fr auto;
           grid-template-areas: "plan header" "plan floors" "plan chips" "plan actions"; column-gap: 1.2rem; row-gap: .7rem; }
    header { grid-area: header; } #floors { grid-area: floors; } #planwrap { grid-area: plan; }
    #chips { grid-area: chips; flex-wrap: wrap; align-content: flex-start; min-height: 0; }
    #chips .chip { margin-bottom: .45rem; }
    .actions { grid-area: actions; }
  }
  .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  #floors { display: flex; overflow-x: auto; flex-shrink: 0; gap: .4rem; }
  #floors button { background: var(--card); border-radius: .7rem; padding: .3rem .7rem; white-space: nowrap; }
  #floors button.sel { background: var(--accent); color: white; }
  #problems { background: #8a2424; color: white; border-radius: .7rem; padding: .5rem; max-height: 5rem; overflow: auto; flex-shrink: 0; }
  .setup { max-width: 38rem; padding: 2rem; margin: auto; font-size: 1rem; }
  #plan .win { stroke: var(--glass); stroke-width: var(--win-w); }
  #plan .win.open { stroke: #26c6da; }
  #plan .setup-label { fill: var(--accent); font-weight: 700; }
  #plan .rn { letter-spacing: .02em; }
  #plan .room:focus { stroke: var(--accent); outline: none; }
  .row span { overflow-wrap: anywhere; min-width: 0; }
  .row .st { white-space: normal; }
  .trv .nm { width: 7rem; overflow-wrap: anywhere; }
  #visitor .sheet { max-height: 90vh; }
  #visitor img { min-height: 0; max-height: 65vh; object-fit: contain; }
  .sheet { overflow-wrap: anywhere; }
  @media (min-aspect-ratio: 3/2) { html { font-size: 2.6vmin; } .chips { max-height: 2.7rem; } }

<script>

function icon(name) {

  });

    if (!P.rooms.some(function (r) { return r.name === name; })) problem('Unknown room: ' + name);

  document.body.innerHTML = '<div class="setup"><h1>Floor Panel setup</h1><p>' + esc(message) + '</p><p>Copy config.example.json to config.json beside index.html, then edit your entity ids. Keep plan.json in this folder too. README.md explains each setting.</p><p>Try <a href="?demo=1">the demo</a>, or add <code>?setup=1</code> to map window and door numbers.</p></div>';
}
function get(name) {
  return fetch(name + '?t=' + Date.now(), {cache: 'no-store'}).then(function (r) {
    if (!r.ok) { var e = new Error(name + ' could not be loaded (' + r.status + ')'); e.missing = r.status === 404; throw e; }
    return r.text();
  }).then(function (text) { try { return JSON.parse(text); } catch (e) { throw new Error(name + ' contains invalid JSON: ' + e.message); } });
}
Promise.all([get('plan.json'), get('config.json').catch(function (e) { if (DEMO && e.missing) return get('config.example.json'); throw e; })]).then(function (data) {
  P = data[0]; readConfig(data[1]); drawPlan(); wire(); renderClock(); renderChips();
  ha = HALite.create({entities: ENTITIES, roles: ROLE});
  ha.on('states', function (states) { S = states; render(); window.__fw.ready = true; });
  ha.on('status', function (status) { $('conn').className = status; });
  setInterval(render, 15000);
  return ha.start();
}).catch(function (e) { fatal(e.message); });
</script></body></html>
